<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Van VIN Manager PWA</title>

<link rel="manifest" id="manifestPlace">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:linear-gradient(180deg,#0b0d12,#0f1115);
  color:white;
  padding:16px;
}

.header{
  position:sticky;
  top:0;
  background:rgba(15,17,21,0.92);
  backdrop-filter:blur(12px);
  z-index:10;
  padding-bottom:10px;
}

h2{margin:0;font-size:22px;}

.search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#1a1d24;
  color:white;
  margin-top:10px;
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:12px;
}

.badge{
  padding:6px 10px;
  background:#1a1d24;
  border-radius:999px;
}

.warn{
  background:#ff9800;
  color:black;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.tile{
  background:#1a1d24;
  padding:14px;
  border-radius:16px;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.reg{font-weight:800;}
.vin{font-size:12px;opacity:0.7;word-break:break-all;margin-top:6px;}

.tag{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  display:inline-block;
  margin-top:6px;
}

.ev{background:#2684ff;}
.diesel{background:#1db954;}
.rental{background:#9c27b0;}
.unknown{background:#ff9800;color:black;}

.btnRow{display:flex;gap:6px;margin-top:10px;}

.btn{
  flex:1;
  padding:8px;
  font-size:12px;
  border:none;
  border-radius:10px;
  background:#313846;
  color:white;
}

.offline{
  background:#ff3b30;
  padding:8px;
  border-radius:10px;
  margin-top:10px;
  display:none;
}

.modalBackdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:flex-end;
  padding:14px;
}

.modal{
  width:100%;
  max-width:420px;
  background:#1a1d24;
  border-radius:20px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

input,select{
  padding:14px;
  border-radius:12px;
  border:none;
  background:#0f1115;
  color:white;
}

.modalActions{
  margin-top:auto;
  display:flex;
  gap:10px;
}

.modalActions button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  color:white;
}

.saveM{background:#1db954;}
.cancelM{background:#444;}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1db954;
  padding:10px 14px;
  border-radius:14px;
  opacity:0;
  transition:0.3s;
}
.show{opacity:1;}
</style>
</head>

<body>

<div class="header">
  <h2>Van VIN Manager PWA</h2>

  <input class="search" id="search" placeholder="Search VIN or reg..." oninput="render()"/>

  <div class="offline" id="offline">⚠️ Offline Mode - using local data</div>

  <div class="stats" id="stats"></div>

  <div id="warning"></div>

  <button onclick="openAdd()" style="margin-top:10px;width:100%;padding:14px;border:none;border-radius:14px;background:#2684ff;color:white;font-weight:700;">
    + Add Vehicle
  </button>

  <button onclick="saveData()" style="margin-top:8px;width:100%;padding:14px;border:none;border-radius:14px;background:#1db954;color:white;font-weight:700;">
    Save / Sync
  </button>
</div>

<div id="app"></div>

<!-- MODAL -->
<div class="modalBackdrop" id="modal">
  <div class="modal">

    <h3>Add Vehicle</h3>

    <select id="typeInput">
      <option value="diesel">Diesel</option>
      <option value="ev">EV</option>
      <option value="rental">Rental</option>
      <option value="unknown">Unknown</option>
    </select>

    <input id="nameInput" placeholder="Reg"/>
    <input id="vinInput" placeholder="VIN"/>

    <div class="modalActions">
      <button class="saveM" onclick="confirmModal()">Save</button>
      <button class="cancelM" onclick="closeModal()">Cancel</button>
    </div>

  </div>
</div>

<div id="toast" class="toast">Saved</div>

<script>
/* =========================
   OFFLINE FIRST STORAGE
========================= */

const SUPABASE_URL = "https://trhqigmwwfhuclaxdope.supabase.co"
const SUPABASE_KEY = "YOUR_KEY"

let data = {
  diesel:[],
  ev:[],
  rental:[],
  unknown:[]
}

let online = navigator.onLine

window.addEventListener("online", ()=>{ online=true; syncStatus() })
window.addEventListener("offline", ()=>{ online=false; syncStatus() })

function syncStatus(){
  document.getElementById("offline").style.display = online ? "none" : "block"
}

/* =========================
   LOAD
========================= */

async function loadData(){

  const local = localStorage.getItem("vin_data")

  if(local){
    data = JSON.parse(local)
  }

  if(online){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1&select=data`,{
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      })

      const json = await res.json()

      if(json?.[0]?.data){
        data = json[0].data
        saveLocal()
      }

    }catch(e){}
  }

  render()
}

/* =========================
   SAVE LOCAL
========================= */

function saveLocal(){
  localStorage.setItem("vin_data", JSON.stringify(data))
}

/* =========================
   SYNC
========================= */

async function saveData(){

  saveLocal()

  if(!online){
    toast("Saved offline")
    return
  }

  try{
    await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1`,{
      method:"PATCH",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({data})
    })

    toast("Synced")

  }catch(e){
    toast("Sync failed")
  }
}

/* =========================
   DUPLICATES
========================= */

function getDuplicates(){
  const seen={}
  const dup=[]

  for(const t of Object.keys(data)){
    for(const v of data[t]){
      if(seen[v.vin]) dup.push(v.vin)
      else seen[v.vin]=true
    }
  }

  return [...new Set(dup)]
}

/* =========================
   FILTER
========================= */

function filtered(list){
  const q=document.getElementById("search").value.toLowerCase()
  return list.filter(v =>
    (v.name||"").toLowerCase().includes(q) ||
    (v.vin||"").toLowerCase().includes(q)
  )
}

/* =========================
   SECTION
========================= */

function section(title,type){

  const list = filtered(data[type]||[])

  let html = `<div style="margin-top:18px">
  <div style="font-weight:700;margin-bottom:10px">${title} (${list.length})</div>
  <div class="grid">`

  for(const v of list){

    html+=`
    <div class="tile">
      <div>
        <div class="reg">${v.name}</div>
        <div class="vin">${v.vin}</div>
        <div class="tag ${type}">${type}</div>
      </div>

      <div class="btnRow">
        <button class="btn" onclick="copy('${v.vin}')">VIN</button>
        <button class="btn" onclick="copy('${v.name}')">REG</button>
      </div>
    </div>`
  }

  html+="</div></div>"
  return html
}

/* =========================
   RENDER
========================= */

function render(){

  const stats = `
    <span class="badge">D ${data.diesel.length}</span>
    <span class="badge">E ${data.ev.length}</span>
    <span class="badge">R ${data.rental.length}</span>
    <span class="badge">U ${data.unknown.length}</span>
  `

  document.getElementById("stats").innerHTML = stats

  const dup = getDuplicates()
  document.getElementById("warning").innerHTML =
    dup.length ? `<div class="warn">⚠ ${dup.length} duplicate VINs detected</div>` : ""

  document.getElementById("app").innerHTML =
    section("Diesel","diesel") +
    section("EV","ev") +
    section("Rental","rental") +
    section("Unknown","unknown")
}

/* =========================
   COPY
========================= */

async function copy(t){
  await navigator.clipboard.writeText(t)
  toast("Copied")
}

/* =========================
   MODAL
========================= */

function openAdd(){
  document.getElementById("modal").style.display="flex"
}

function closeModal(){
  document.getElementById("modal").style.display="none"
}

function confirmModal(){

  const type=document.getElementById("typeInput").value
  const name=document.getElementById("nameInput").value
  const vin=document.getElementById("vinInput").value

  if(!name||!vin) return

  data[type].push({name,vin})

  saveLocal()
  closeModal()
  render()
}

/* =========================
   TOAST
========================= */

function toast(msg){
  const t=document.getElementById("toast")
  t.innerText=msg
  t.classList.add("show")
  setTimeout(()=>t.classList.remove("show"),1200)
}

/* =========================
   INIT
========================= */

syncStatus()
loadData()

/* =========================
   PWA MANIFEST + SW
========================= */

const manifest = {
  name:"Van VIN Manager",
  short_name:"VIN Manager",
  start_url:".",
  display:"standalone",
  background_color:"#0f1115",
  theme_color:"#0f1115"
}

const blob = new Blob([JSON.stringify(manifest)],{type:"application/json"})
document.getElementById("manifestPlace").href = URL.createObjectURL(blob)

if("serviceWorker" in navigator){

  const sw = `
  self.addEventListener('install', e=>{
    e.waitUntil(
      caches.open('vin-cache').then(cache=>{
        return cache.addAll(['./'])
      })
    )
  })

  self.addEventListener('fetch', e=>{
    e.respondWith(
      caches.match(e.request).then(r=>r||fetch(e.request))
    )
  })
  `

  const swBlob = new Blob([sw],{type:"text/javascript"})
  navigator.serviceWorker.register(URL.createObjectURL(swBlob))
}

</script>

</body>
</html>
