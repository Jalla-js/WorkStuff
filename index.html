<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Van VIN Manager</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0f1115;
  color:white;
  padding:16px;
}

/* HEADER */
.header{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:14px;
}

.topRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

h2{
  margin:0;
  font-size:22px;
}

/* BUTTONS */
.saveBtn, .addGlobal{
  flex:1;
  border:none;
  border-radius:12px;
  padding:12px;
  color:white;
  font-weight:700;
  font-size:15px;
}

.saveBtn{ background:#1db954; }
.addGlobal{ background:#2684ff; }

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#1a1d24;
  color:white;
  font-size:16px;
}

/* CATEGORY */
.category{
  margin-bottom:14px;
  border-radius:14px;
  overflow:hidden;
}

.catHeader{
  padding:14px;
  font-weight:700;
  font-size:18px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

.catHeader small{
  opacity:0.7;
}

/* THEMES */
.diesel .catHeader{ background:#111; }
.ev .catHeader{ background:#0f3d1f; }
.rental .catHeader{ background:#0b2a5a; }

.catContent{
  display:none;
  padding:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
}

/* TILE */
.tile{
  background:#1a1d24;
  border-radius:16px;
  padding:14px;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.reg{
  font-size:18px;
  font-weight:800;
  letter-spacing:0.5px;
}

.vin{
  font-size:13px;
  opacity:0.75;
  margin-top:6px;
  word-break:break-all;
}

/* BUTTONS */
.btnRow{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.btn{
  flex:1;
  padding:10px;
  font-size:13px;
  border:none;
  border-radius:10px;
  background:#313846;
  color:white;
}

/* MODAL */
.modalBackdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal{
  width:92%;
  height:85%;
  background:#1a1d24;
  border-radius:16px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.modal h3{
  margin:0;
  font-size:20px;
}

/* INPUTS */
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

label{
  font-size:14px;
  opacity:0.8;
}

input, select{
  padding:14px;
  border-radius:12px;
  border:none;
  background:#0f1115;
  color:white;
  font-size:16px;
}

/* MODAL ACTIONS */
.modalActions{
  margin-top:auto;
  display:flex;
  gap:10px;
}

.modalActions button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  color:white;
}

.saveM{ background:#1db954; }
.cancelM{ background:#444; }

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1db954;
  padding:12px 18px;
  border-radius:12px;
  opacity:0;
  transition:0.3s;
}

.show{ opacity:1; }

@media(max-width:420px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="header">

  <h2>Van VIN Manager</h2>

  <input class="search" id="search" placeholder="Search vehicle reg..." oninput="render()"/>

  <div class="topRow">
    <button class="addGlobal" onclick="openAdd()">+ Add Vehicle</button>
    <button class="saveBtn" onclick="saveData()">Save</button>
  </div>

</div>

<div id="app"></div>

<!-- MODAL -->
<div class="modalBackdrop" id="modal">

  <div class="modal">

    <h3 id="modalTitle">Add Vehicle</h3>

    <div class="field">
      <label>Category</label>
      <select id="typeInput">
        <option value="diesel">Diesel</option>
        <option value="ev">EV</option>
        <option value="rental">Rental</option>
      </select>
    </div>

    <div class="field">
      <label>Vehicle Reg / Name</label>
      <input id="nameInput"/>
    </div>

    <div class="field">
      <label>VIN</label>
      <input id="vinInput"/>
    </div>

    <div class="modalActions">
      <button class="saveM" onclick="confirmModal()">Save</button>
      <button class="cancelM" onclick="closeModal()">Cancel</button>
    </div>

  </div>
</div>

<div id="toast" class="toast">Saved</div>

<script>

const SUPABASE_URL = "https://trhqigmwwfhuclaxdope.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyaHFpZ213d2ZodWNsYXhkb3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEyNjcsImV4cCI6MjA5NTMxNzI2N30.XYXIXzCFqx5R2AoZ286WrKMN-FCSl_AZ9LoGdLuKMDc"

let data = { diesel:[], ev:[], rental:[] }

let currentType = null
let editIndex = null

const toastEl = document.getElementById("toast")

function toast(msg){
  toastEl.innerText = msg
  toastEl.classList.add("show")
  setTimeout(()=>toastEl.classList.remove("show"),1500)
}

/* LOAD */
async function loadData(){
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/van_data?id=eq.1&select=data`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    )

    const json = await res.json()
    if(json?.[0]?.data) data = json[0].data

  }catch(e){}

  render()
}

/* SAVE */
async function saveData(){
  await fetch(
    `${SUPABASE_URL}/rest/v1/van_data?id=eq.1`,
    {
      method:"PATCH",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({data})
    }
  )

  toast("Saved")
}

/* SEARCH FILTER */
function getFiltered(type){
  const q = document.getElementById("search").value.toLowerCase()
  return data[type].filter(v =>
    v.name.toLowerCase().includes(q)
  )
}

/* MODAL */
function openAdd(){
  currentType = null
  editIndex = null

  document.getElementById("modalTitle").innerText = "Add Vehicle"
  document.getElementById("nameInput").value = ""
  document.getElementById("vinInput").value = ""

  modal.style.display="flex"
}

function openEdit(type,i){
  currentType = type
  editIndex = i

  const v = data[type][i]

  document.getElementById("modalTitle").innerText = "Edit Vehicle"
  document.getElementById("typeInput").value = type
  document.getElementById("nameInput").value = v.name
  document.getElementById("vinInput").value = v.vin

  modal.style.display="flex"
}

function closeModal(){
  modal.style.display="none"
}

function confirmModal(){
  const type = document.getElementById("typeInput").value
  const name = document.getElementById("nameInput").value
  const vin = document.getElementById("vinInput").value

  if(!name || !vin) return

  if(editIndex === null){
    data[type].push({name,vin})
  }else{
    data[currentType][editIndex] = {name,vin}
  }

  closeModal()
  render()
}

/* ACTIONS */
function deleteItem(type,i){
  data[type].splice(i,1)
  render()
}

async function copyVIN(vin){
  try{
    await navigator.clipboard.writeText(vin)
    toast("Copied")
  }catch{
    alert(vin)
  }
}

/* RENDER */
function section(title,type){

  const list = getFiltered(type)

  let html = `<div class="category ${type}">`

  html += `<div class="catHeader" onclick="toggle('${type}')">
    ${title}
    <small>${list.length}</small>
  </div>`

  html += `<div class="catContent" id="${type}" style="display:block;">`

  html += `<div class="grid">`

  for(let i=0;i<list.length;i++){

    const v = list[i]

    const realIndex = data[type].indexOf(v)

    html += `<div class="tile">
      <div>
        <div class="reg">${v.name}</div>
        <div class="vin">${v.vin}</div>
      </div>

      <div class="btnRow">
        <button class="btn" onclick="copyVIN('${v.vin}')">Copy</button>
        <button class="btn" onclick="openEdit('${type}',${realIndex})">Edit</button>
        <button class="btn" onclick="deleteItem('${type}',${realIndex})">Del</button>
      </div>
    </div>`
  }

  html += `</div></div></div>`

  return html
}

function render(){
  document.getElementById("app").innerHTML =
    section("Diesel","diesel") +
    section("EV","ev") +
    section("Rental","rental")
}

function toggle(type){
  const el = document.getElementById(type)
  el.style.display = el.style.display==="none"?"block":"none"
}

/* START */
loadData()

</script>

</body>
</html>
