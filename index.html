<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Van VIN Manager</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0f1115;
  color:white;
  padding:16px;
  -webkit-text-size-adjust:100%;
}

/* HEADER */
.header{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:14px;
}

h2{
  margin:0;
  font-size:22px;
}

.topRow{
  display:flex;
  gap:10px;
}

.saveBtn, .addGlobal{
  flex:1;
  border:none;
  border-radius:14px;
  padding:14px;
  color:white;
  font-weight:700;
  font-size:16px;
}

.saveBtn{ background:#1db954; }
.addGlobal{ background:#2684ff; }

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#1a1d24;
  color:white;
  font-size:16px;
}

/* SECTION */
.section{
  margin-bottom:18px;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:700;
  margin:10px 0;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
}

/* TILE */
.tile{
  background:#1a1d24;
  border-radius:16px;
  padding:14px;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 6px 18px rgba(0,0,0,0.35);
}

.reg{
  font-size:18px;
  font-weight:800;
}

.vin{
  font-size:13px;
  opacity:0.7;
  word-break:break-all;
  margin-top:6px;
}

/* BUTTONS */
.btnRow{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.btn{
  flex:1;
  padding:10px;
  font-size:13px;
  border:none;
  border-radius:10px;
  background:#313846;
  color:white;
}

/* MODAL BACKDROP */
.modalBackdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  justify-content:center;
  align-items:flex-end;
  padding:14px;
}

/* MAIN MODAL */
.modal{
  width:100%;
  max-width:420px;
  height:90%;
  background:#1a1d24;
  border-radius:22px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* INPUTS */
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

label{
  font-size:13px;
  opacity:0.7;
}

input, select{
  padding:14px;
  border-radius:12px;
  border:none;
  background:#0f1115;
  color:white;
  font-size:16px;
}

/* SCAN BUTTON */
.scanBtn{
  margin-top:6px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#444;
  color:white;
  font-size:14px;
}

/* MODAL ACTIONS */
.modalActions{
  margin-top:auto;
  display:flex;
  gap:10px;
}

.modalActions button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  color:white;
}

.saveM{ background:#1db954; }
.cancelM{ background:#444; }

/* SCAN MODAL */
.scanVideo{
  width:100%;
  border-radius:14px;
  background:black;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#1db954;
  padding:12px 18px;
  border-radius:14px;
  opacity:0;
  transition:0.3s;
}

.show{ opacity:1; }

@media(max-width:420px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="header">

  <h2>Van VIN Manager</h2>

  <input class="search" id="search" placeholder="Search reg..." oninput="render()"/>

  <div class="topRow">
    <button class="addGlobal" onclick="openAdd()">+ Add Vehicle</button>
    <button class="saveBtn" onclick="saveData()">Save</button>
  </div>

</div>

<div id="app"></div>

<!-- MAIN MODAL -->
<div class="modalBackdrop" id="modal">

  <div class="modal">

    <h3 id="modalTitle">Add Vehicle</h3>

    <div class="field">
      <label>Category</label>
      <select id="typeInput">
        <option value="diesel">Diesel</option>
        <option value="ev">EV</option>
        <option value="rental">Rental</option>
      </select>
    </div>

    <div class="field">
      <label>Vehicle Reg</label>
      <input id="nameInput"/>
    </div>

    <div class="field">
      <label>VIN</label>
      <input id="vinInput"/>

      <button class="scanBtn" onclick="startScan()">📷 Scan instead</button>
    </div>

    <div class="modalActions">
      <button class="saveM" onclick="confirmModal()">Save</button>
      <button class="cancelM" onclick="closeModal()">Cancel</button>
    </div>

  </div>
</div>

<!-- SCAN MODAL -->
<div class="modalBackdrop" id="scanModal">

  <div class="modal">

    <h3>Scan VIN</h3>

    <video id="video" class="scanVideo"></video>

    <div class="field">
      <label>Detected VIN</label>
      <input id="scanResult"/>
    </div>

    <div class="modalActions">
      <button class="saveM" onclick="confirmScan()">Confirm</button>
      <button class="cancelM" onclick="closeScan()">Cancel</button>
    </div>

  </div>

</div>

<div id="toast" class="toast">Saved</div>

<script>

const SUPABASE_URL = "https://trhqigmwwfhuclaxdope.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyaHFpZ213d2ZodWNsYXhkb3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEyNjcsImV4cCI6MjA5NTMxNzI2N30.XYXIXzCFqx5R2AoZ286WrKMN-FCSl_AZ9LoGdLuKMDc
"

let data = { diesel:[], ev:[], rental:[] }
let currentType = null
let editIndex = null
let stream = null

const toastEl = document.getElementById("toast")

function toast(msg){
  toastEl.innerText = msg
  toastEl.classList.add("show")
  setTimeout(()=>toastEl.classList.remove("show"),1500)
}

/* LOAD */
async function loadData(){
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/van_data?id=eq.1&select=data`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    )

    const json = await res.json()
    if(json?.[0]?.data) data = json[0].data

  }catch(e){}

  render()
}

/* SAVE */
async function saveData(){
  await fetch(
    `${SUPABASE_URL}/rest/v1/van_data?id=eq.1`,
    {
      method:"PATCH",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({data})
    }
  )

  toast("Saved")
}

/* SEARCH */
function filtered(type){
  const q = document.getElementById("search").value.toLowerCase()
  return data[type].filter(v =>
    v.name.toLowerCase().includes(q)
  )
}

/* MODAL */
function openAdd(){
  currentType = null
  editIndex = null

  document.getElementById("modalTitle").innerText = "Add Vehicle"
  document.getElementById("nameInput").value = ""
  document.getElementById("vinInput").value = ""

  modal.style.display="flex"
}

function openEdit(type,i){
  currentType = type
  editIndex = i

  const v = data[type][i]

  document.getElementById("modalTitle").innerText = "Edit Vehicle"
  document.getElementById("typeInput").value = type
  document.getElementById("nameInput").value = v.name
  document.getElementById("vinInput").value = v.vin

  modal.style.display="flex"
}

function closeModal(){
  modal.style.display="none"
}

/* SAVE MODAL */
function confirmModal(){
  const type = document.getElementById("typeInput").value
  const name = document.getElementById("nameInput").value
  const vin = document.getElementById("vinInput").value

  if(!name || !vin) return

  if(editIndex === null){
    data[type].push({name,vin})
  }else{
    data[currentType][editIndex] = {name,vin}
  }

  closeModal()
  render()
}

/* DELETE */
function del(type,i){
  data[type].splice(i,1)
  render()
}

/* COPY */
async function copyVIN(vin){
  try{
    await navigator.clipboard.writeText(vin)
    toast("Copied")
  }catch{
    alert(vin)
  }
}

/* RENDER */
function section(title,type){

  const list = filtered(type)

  let html = `<div class="section">`
  html += `<div class="sectionTitle">${title} (${list.length})</div>`
  html += `<div class="grid">`

  for(let v of list){

    const i = data[type].indexOf(v)

    html += `<div class="tile">
      <div>
        <div class="reg">${v.name}</div>
        <div class="vin">${v.vin}</div>
      </div>

      <div class="btnRow">
        <button class="btn" onclick="copyVIN('${v.vin}')">Copy</button>
        <button class="btn" onclick="openEdit('${type}',${i})">Edit</button>
        <button class="btn" onclick="del('${type}',${i})">Del</button>
      </div>
    </div>`
  }

  html += `</div></div>`
  return html
}

function render(){
  document.getElementById("app").innerHTML =
    section("Diesel","diesel") +
    section("EV","ev") +
    section("Rental","rental")
}

/* =========================
   OCR / SCANNER
========================= */

async function startScan(){

  document.getElementById("scanModal").style.display="flex"

  const video = document.getElementById("video")
  const result = document.getElementById("scanResult")

  try{

    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"environment" }
    })

    video.srcObject = stream
    await video.play()

    const detector = new BarcodeDetector({
      formats:["code_128","ean_13","qr_code","data_matrix"]
    })

    const canvas = document.createElement("canvas")
    const ctx = canvas.getContext("2d")

    function tick(){

      if(!video.videoWidth){
        requestAnimationFrame(tick)
        return
      }

      canvas.width = video.videoWidth
      canvas.height = video.videoHeight

      ctx.drawImage(video,0,0)

      detector.detect(canvas).then(codes=>{
        if(codes.length){
          result.value = codes[0].rawValue
          stream.getTracks().forEach(t=>t.stop())
        }
      }).catch(()=>{})

      requestAnimationFrame(tick)
    }

    tick()

  }catch(e){
    alert("Camera blocked")
  }
}

function confirmScan(){
  document.getElementById("vinInput").value =
    document.getElementById("scanResult").value

  closeScan()
}

function closeScan(){
  document.getElementById("scanModal").style.display="none"
  if(stream) stream.getTracks().forEach(t=>t.stop())
}

/* START */
loadData()

</script>

</body>
</html>
