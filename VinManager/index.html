<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Van VIN Manager</title>

<style>
:root{
  --bg:#0b0d12;
  --card:#151923;
  --text:#e8ecf1;
  --muted:#8b93a1;
  --accent:#4aa3ff;
}

body.light{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111318;
  --muted:#5a6472;
  --accent:#0066ff;
}

body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.2s ease;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
}

button{
  border:none;
  padding:10px 12px;
  border-radius:10px;
  background:var(--card);
  color:var(--text);
}

.container{padding:10px 16px;}

.card{
  background:var(--card);
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
}

.small{
  color:var(--muted);
  font-size:12px;
}

.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  font-size:26px;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  width:90%;
  max-width:360px;
}

.type-buttons{
  display:flex;
  gap:10px;
  margin:10px 0;
}

.type-buttons button{
  flex:1;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #333;
  background:transparent;
  color:var(--text);
}

.offline{
  font-size:12px;
  color:#ff5a5a;
}

.online{
  font-size:12px;
  color:#3bd16f;
}
</style>
</head>

<body>

<header>
  <div>
    <strong>Van VIN Manager</strong><br>
    <span id="netStatus" class="small"></span>
  </div>

  <button onclick="toggleTheme()">🌓</button>
</header>

<div class="container" id="list"></div>

<button class="fab" onclick="openModal()">+</button>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Van</h3>

    <input id="vin" placeholder="VIN" />

    <div class="type-buttons">
      <button onclick="setType('Diesel')">Diesel</button>
      <button onclick="setType('EV')">EV</button>
      <button onclick="setType('Rental')">Rental</button>
    </div>

    <div class="small">Type: <span id="typeLabel">None</span></div>

    <button style="width:100%; margin-top:12px;" onclick="saveVan()">Save</button>
    <button style="width:100%; margin-top:8px;" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let vans = JSON.parse(localStorage.getItem("vans") || "[]");
let selectedType = null;

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  vans.forEach(v => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <strong>${v.vin}</strong><br>
      <span class="small">${v.type}</span>
    `;
    list.appendChild(div);
  });
}

function saveToStorage(){
  localStorage.setItem("vans", JSON.stringify(vans));
}

function openModal(){
  if(!navigator.onLine){
    alert("You are offline — adding vans is disabled.");
    return;
  }
  document.getElementById("modal").style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
  selectedType = null;
  document.getElementById("typeLabel").innerText = "None";
  document.getElementById("vin").value = "";
}

function setType(t){
  selectedType = t;
  document.getElementById("typeLabel").innerText = t;
}

function saveVan(){
  if(!navigator.onLine){
    alert("Offline mode: cannot add or edit vans.");
    return;
  }

  const vin = document.getElementById("vin").value.trim();
  if(!vin || !selectedType) return;

  vans.push({ vin, type: selectedType });
  saveToStorage();
  render();
  closeModal();
}

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}

/* offline handling */
function updateNet(){
  const el = document.getElementById("netStatus");
  if(navigator.onLine){
    el.textContent = "Online";
    el.className = "online";
  } else {
    el.textContent = "Offline (cached data only)";
    el.className = "offline";
  }
}

/* init */
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);

(function init(){
  if(localStorage.getItem("theme") === "light"){
    document.body.classList.add("light");
  }

  updateNet();
  render();
})();
</script>

</body>
</html>
