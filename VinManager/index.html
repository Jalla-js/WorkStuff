<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Van VIN Manager</title>

<style>
:root{
  --bg:#0b0d12;
  --card:#151923;
  --text:#e8ecf1;
  --muted:#8b93a1;
  --accent:#4aa3ff;
}

body.light{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111318;
  --muted:#5a6472;
  --accent:#0066ff;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.2s ease;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
}

button{
  border:none;
  padding:10px 12px;
  border-radius:10px;
  background:var(--card);
  color:var(--text);
}

.container{padding:10px 16px;}

.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  font-size:26px;
  border:none;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  width:90%;
  max-width:360px;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #333;
  background:transparent;
  color:var(--text);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:12px;
}

.section{margin-top:18px;}
.sectionTitle{font-weight:700;margin-bottom:10px;}

.tile{
  background:var(--card);
  padding:12px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.reg{font-weight:800;}
.vin{font-size:12px;opacity:.75;word-break:break-all;margin-top:4px;}

.tag{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  display:inline-block;
  margin-top:6px;
}

.ev{background:var(--accent);}
.diesel{background:#1db954;}
.rental{background:#9c27b0;}
.unknown{background:#ff9800;color:#111;}

.btnRow{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  margin-top:10px;
}

.btn{
  padding:8px;
  font-size:12px;
  border:none;
  border-radius:10px;
  background:#2b3242;
  color:white;
}

.online{font-size:12px;color:#3bd16f;}
.offline{font-size:12px;color:#ff5a5a;}
</style>
</head>

<body>

<header>
  <div>
    <strong>Van VIN Manager</strong><br>
    <span id="netStatus" class="small"></span>
  </div>

  <button onclick="toggleTheme()">🌓</button>
</header>

<div class="container" id="app"></div>

<button class="fab" onclick="openModal()">+</button>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Van</h3>

    <input id="reg" placeholder="Reg plate"/>
    <input id="vin" placeholder="VIN"/>

    <div class="type-buttons">
      <button onclick="setType('diesel')">Diesel</button>
      <button onclick="setType('ev')">EV</button>
      <button onclick="setType('rental')">Rental</button>
    </div>

    <div class="small">Type: <span id="typeLabel">None</span></div>

    <button style="width:100%; margin-top:12px;" onclick="saveVan()">Save</button>
    <button style="width:100%; margin-top:8px;" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://trhqigmwwfhuclaxdope.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyaHFpZ213d2ZodWNsYXhkb3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEyNjcsImV4cCI6MjA5NTMxNzI2N30.XYXIXzCFqx5R2AoZ286WrKMN-FCSl_AZ9LoGdLuKMDc";

/* ================= STATE ================= */
let vans = [];
let selectedType = null;
let queue = JSON.parse(localStorage.getItem("queue") || "[]");

/* ================= LOAD ================= */
async function loadData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1&select=data`,{
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`
      }
    });

    const json = await res.json();
    const d = json?.[0]?.data;

    if(d){
      vans = [
        ...d.diesel.map(v=>({...v,type:"diesel"})),
        ...d.ev.map(v=>({...v,type:"ev"})),
        ...d.rental.map(v=>({...v,type:"rental"})),
        ...d.unknown.map(v=>({...v,type:"unknown"}))
      ];
    }

    render();
  } catch(e){
    render();
  }
}

/* ================= SAVE ================= */
async function saveData(){
  const grouped = {
    diesel: vans.filter(v=>v.type==="diesel"),
    ev: vans.filter(v=>v.type==="ev"),
    rental: vans.filter(v=>v.type==="rental"),
    unknown: vans.filter(v=>v.type==="unknown")
  };

  if(!navigator.onLine){
    queue.push({type:"save",data:grouped});
    localStorage.setItem("queue",JSON.stringify(queue));
    localStorage.setItem("cache",JSON.stringify(vans));
    return;
  }

  await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1`,{
    method:"PATCH",
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({data:grouped})
  });
}

/* ================= SYNC ================= */
async function sync(){
  if(!navigator.onLine) return;
  for(const q of queue){
    if(q.type==="save") await saveData();
  }
  queue=[];
  localStorage.setItem("queue","[]");
}

/* ================= UI ================= */
function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
  selectedType=null;
}

function setType(t){
  selectedType=t;
}

function saveVan(){
  const reg=document.getElementById("reg").value.trim();
  const vin=document.getElementById("vin").value.trim();

  if(!reg || !vin || !selectedType) return;

  vans.push({name:reg,vin,type:selectedType});

  saveData();
  render();
  closeModal();
}

/* ================= RENDER ================= */
function section(title,type){
  const list=vans.filter(v=>v.type===type);

  return `
  <div class="section">
    <div class="sectionTitle">${title}</div>
    <div class="grid">
      ${list.map(v=>`
        <div class="tile">
          <div>
            <div class="reg">${v.name}</div>
            <div class="vin">${v.vin}</div>
            <div class="tag ${type}">${type}</div>
          </div>

          <div class="btnRow">
            <button class="btn" onclick="copyVIN('${v.vin}')">Copy VIN</button>
            <button class="btn" onclick="editVIN('${v.vin}')">Edit</button>
          </div>
        </div>
      `).join("")}
    </div>
  </div>`;
}

function render(){
  document.getElementById("app").innerHTML =
    section("Diesel","diesel") +
    section("EV","ev") +
    section("Rental","rental") +
    section("Unknown","unknown");
}

/* ================= ACTIONS ================= */
async function copyVIN(v){
  await navigator.clipboard.writeText(v);
}

function editVIN(v){
  alert("Edit system already supported in DB layer (can expand if needed)");
}

/* ================= THEME ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* ================= NETWORK ================= */
function updateNet(){
  document.getElementById("netStatus").innerText =
    navigator.onLine ? "Online" : "Offline";
}

window.addEventListener("online",()=>{updateNet();sync();});
window.addEventListener("offline",updateNet);

/* INIT */
updateNet();
loadData();

</script>

</body>
</html>
