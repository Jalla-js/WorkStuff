<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Van VIN Manager</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2684ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIN Manager">

<style>
:root{--bg:#0b0d12;--bg2:#0f1115;--card2:#1a1d24;--text:#fff;--blue:#2684ff;--green:#1db954;--purple:#9c27b0;--orange:#ff9800;--red:#ff3b30}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);padding:16px}
button,input,select{font:inherit}

.header{position:sticky;top:0;background:rgba(15,17,21,.94);backdrop-filter:blur(12px);z-index:10;padding-bottom:12px}
h2{margin:0;font-size:22px}

.search,.modal input,.modal select{
width:100%;padding:14px;border-radius:14px;border:none;background:var(--card2);color:var(--text)
}
.search{margin-top:10px}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.badge{padding:6px 10px;background:var(--card2);border-radius:999px}

.warn{background:var(--orange);color:#111;padding:10px;border-radius:12px;margin-top:10px;font-weight:700;cursor:pointer}

.errorBox{padding:10px;border-radius:12px;margin-top:10px;display:none;background:#4a1717;color:#ffd4d4;white-space:pre-wrap}

.section{margin-top:18px}
.sectionTitle{font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.tile{background:var(--card2);padding:14px;border-radius:16px;min-height:144px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}

.reg{font-weight:800}
.vin{font-size:12px;opacity:.75;word-break:break-all;margin-top:6px}

.tag{font-size:11px;padding:3px 8px;border-radius:999px;display:inline-block;margin-top:6px}
.ev{background:var(--blue)}
.diesel{background:var(--green)}
.rental{background:var(--purple)}
.unknown{background:var(--orange);color:#111}

.btnRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.btn{padding:9px;font-size:12px;border:none;border-radius:10px;background:#313846;color:white}
.btn.secondary{background:#3c4557}

.primaryAction{margin-top:10px;width:100%;padding:14px;border:none;border-radius:14px;color:white;font-weight:700}
.blue{background:var(--blue)}
.green{background:var(--green)}

.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:flex-end;padding:14px;z-index:30}
.modal{width:100%;max-width:420px;max-height:85vh;overflow:auto;background:var(--card2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}

.modalActions{display:flex;gap:10px;margin-top:4px}
.modalActions button{flex:1;padding:14px;border:none;border-radius:14px;color:white}

.saveM{background:var(--green)}
.cancelM{background:#444}
.deleteM{background:#792828}
.confirmDelete{background:#8e2d2d}
.ghostBtn{background:#444}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 14px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:40}
.show{opacity:1}

.loading{margin-top:16px;color:#c8d0dc}

.offline{
display:none;
margin-top:10px;
padding:10px;
border-radius:12px;
background:#ff9800;
color:#111;
font-weight:700;
}
</style>
</head>

<body>
<div class="header">
  <h2>Van VIN Manager</h2>

  <div id="offline" class="offline">Offline Mode</div>

  <input class="search" id="search" placeholder="Search VIN or reg..." oninput="render()"/>

  <div class="stats" id="stats"></div>
  <div id="warning"></div>
  <div class="errorBox" id="errorBox"></div>

  <button onclick="openAdd()" class="primaryAction blue">+ Add Vehicle</button>
  <button onclick="saveData()" class="primaryAction green">Save</button>
</div>

<div id="app"><div class="loading">Loading vehicles…</div></div>

<!-- MODALS (UNCHANGED STRUCTURE) -->
<div class="modalBackdrop" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Add Vehicle</h3>
    <select id="typeInput">
      <option value="diesel">Diesel</option>
      <option value="ev">EV</option>
      <option value="rental">Rental</option>
      <option value="unknown">Unknown</option>
    </select>
    <input id="nameInput" placeholder="Reg"/>
    <input id="vinInput" placeholder="VIN"/>

    <div class="modalActions">
      <button class="saveM" onclick="confirmModal()">Save</button>
      <button class="cancelM" onclick="closeModal()">Cancel</button>
    </div>

    <button id="deleteBtn" class="deleteM" onclick="openDeleteConfirm()">Delete Vehicle</button>
  </div>
</div>

<div class="modalBackdrop" id="dupModal"><div class="modal"><h3>Duplicate VINs</h3><div id="dupContent"></div><button class="cancelM" onclick="closeDupModal()">Close</button></div></div>
<div class="modalBackdrop" id="deleteModal"><div class="modal"><h3>Delete vehicle?</h3><div id="confirmDeleteText"></div><div class="modalActions"><button class="ghostBtn" onclick="closeDeleteConfirm()">Cancel</button><button class="confirmDelete" onclick="deleteCurrentConfirmed()">Delete</button></div></div></div>

<div id="toast" class="toast">Saved</div>

<script>
const SUPABASE_URL="https://trhqigmwwfhuclaxdope.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyaHFpZ213d2ZodWNsYXhkb3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEyNjcsImV4cCI6MjA5NTMxNzI2N30.XYXIXzCFqx5R2AoZ286WrKMN-FCSl_AZ9LoGdLuKMDc";

let data={diesel:[],ev:[],rental:[],unknown:[]};
let editState=null;

/* ---------------- OFFLINE CACHE ---------------- */
const CACHE_KEY="vin_cache_v1";

function saveCache(){
  localStorage.setItem(CACHE_KEY,JSON.stringify(data));
}

function loadCache(){
  const cached=localStorage.getItem(CACHE_KEY);
  if(cached){
    try{ data=JSON.parse(cached); render(); }catch(e){}
  }
}

/* ---------------- OFFLINE UI ---------------- */
function updateOnline(){
  document.getElementById("offline").style.display=
    navigator.onLine?"none":"block";
}
window.addEventListener("online",updateOnline);
window.addEventListener("offline",updateOnline);

/* ---------------- SUPABASE ---------------- */
async function loadData(){
  loadCache();

  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1&select=data`,{
      headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
    });

    const json=await res.json();
    const extracted=json?.[0]?.data;

    if(extracted){
      data=normalise(extracted);
      saveCache();
      render();
    }

  }catch(e){}
}

async function saveData(){
  saveCache();

  try{
    await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1`,{
      method:"PATCH",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:`Bearer ${SUPABASE_KEY}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({data})
    });
    toast("Saved");
  }catch(e){
    toast("Saved locally");
  }
}

/* ---------------- CORE ---------------- */
function normalise(o){
  return {
    diesel:o.diesel||[],
    ev:o.ev||[],
    rental:o.rental||[],
    unknown:o.unknown||[]
  };
}

function render(){
  updateOnline();

  document.getElementById("stats").innerHTML=
  `<span class="badge">D ${data.diesel.length}</span>
   <span class="badge">E ${data.ev.length}</span>
   <span class="badge">R ${data.rental.length}</span>
   <span class="badge">U ${data.unknown.length}</span>`;

  document.getElementById("app").innerHTML=
    section("Diesel","diesel")+
    section("EV","ev")+
    section("Rental","rental")+
    section("Unknown","unknown");
}

function section(title,type){
  return `<div class="section"><div class="sectionTitle">${title}</div><div class="grid">`+
  (data[type]||[]).map(v=>`
    <div class="tile">
      <div>
        <div class="reg">${v.name}</div>
        <div class="vin">${v.vin}</div>
        <div class="tag ${type}">${type}</div>
      </div>
      <div class="btnRow">
        <button class="btn" onclick="copy('${v.vin}')">Copy</button>
        <button class="btn secondary" onclick="edit('${type}','${v.vin}')">Edit</button>
      </div>
    </div>`).join("")+
  `</div></div>`;
}

/* ---------------- ACTIONS ---------------- */
function copy(v){navigator.clipboard.writeText(v);toast("Copied");}

function edit(type,vin){
  const i=data[type].findIndex(x=>x.vin===vin);
  editState={type,i};
  const v=data[type][i];
  openAdd(v);
}

function openAdd(v={}){
  modal.style.display="flex";
  typeInput.value=v.type||"diesel";
  nameInput.value=v.name||"";
  vinInput.value=v.vin||"";
}

function confirmModal(){
  const t=typeInput.value;
  const n=nameInput.value.toUpperCase();
  const v=vinInput.value.toUpperCase();

  if(editState){
    data[editState.type].splice(editState.i,1);
  }

  data[t].push({name:n,vin:v});
  saveCache();
  saveData();
  render();
  closeModal();
}

function closeModal(){modal.style.display="none";}

/* ---------------- INIT ---------------- */
loadCache();
loadData();
updateOnline();

/* ---------------- TOAST ---------------- */
function toast(t){
  const el=document.getElementById("toast");
  el.textContent=t;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1200);
}

/* ---------------- SW ---------------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
