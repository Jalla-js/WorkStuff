<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Van VIN Manager</title>

<style>
:root{
  --bg:#0b0d12;
  --card:#151923;
  --text:#e8ecf1;
  --muted:#8b93a1;
  --accent:#4aa3ff;
}

body.light{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#111318;
  --muted:#5a6472;
  --accent:#0066ff;
}

body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.2s ease;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
}

button{
  border:none;
  padding:10px 12px;
  border-radius:10px;
  background:var(--card);
  color:var(--text);
}

.container{padding:10px 16px;}

.card{
  background:var(--card);
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
}

.small{
  color:var(--muted);
  font-size:12px;
}

.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  font-size:26px;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:var(--card);
  padding:16px;
  border-radius:16px;
  width:90%;
  max-width:360px;
}

.type-buttons{
  display:flex;
  gap:10px;
  margin:10px 0;
}

.type-buttons button{
  flex:1;
}

input{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #333;
  background:transparent;
  color:var(--text);
}

.online{font-size:12px;color:#3bd16f;}
.offline{font-size:12px;color:#ff5a5a;}
</style>
</head>

<body>

<header>
  <div>
    <strong>Van VIN Manager</strong><br>
    <span id="netStatus" class="small"></span>
  </div>

  <button onclick="toggleTheme()">🌓</button>
</header>

<div class="container" id="list"></div>

<button class="fab" onclick="openModal()">+</button>

<!-- MODAL (UNCHANGED UI) -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Van</h3>

    <input id="vin" placeholder="VIN" />

    <div class="type-buttons">
      <button onclick="setType('diesel')">Diesel</button>
      <button onclick="setType('ev')">EV</button>
      <button onclick="setType('rental')">Rental</button>
    </div>

    <div class="small">Type: <span id="typeLabel">None</span></div>

    <button style="width:100%; margin-top:12px;" onclick="saveVan()">Save</button>
    <button style="width:100%; margin-top:8px;" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>

/* ================= SUPABASE (YOUR DB) ================= */

const SUPABASE_URL = "https://trhqigmwwfhuclaxdope.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyaHFpZ213d2ZodWNsYXhkb3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEyNjcsImV4cCI6MjA5NTMxNzI2N30.XYXIXzCFqx5R2AoZ286WrKMN-FCSl_AZ9LoGdLuKMDc";

/* ================= OFFLINE SYSTEM ================= */

let vans = JSON.parse(localStorage.getItem("vans") || "[]");
let queue = JSON.parse(localStorage.getItem("queue") || "[]");
let selectedType = null;

/* ================= LOAD FROM DB ================= */

async function loadData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1&select=data`, {
      headers:{
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    });

    const json = await res.json();
    const dbData = json?.[0]?.data;

    if(dbData){
      vans = [
        ...dbData.diesel.map(v => ({...v, type:"diesel"})),
        ...dbData.ev.map(v => ({...v, type:"ev"})),
        ...dbData.rental.map(v => ({...v, type:"rental"}))
      ];

      localStorage.setItem("vans", JSON.stringify(vans));
    }

    render();

  } catch(e){
    console.log("offline load", e);
    render();
  }
}

/* ================= SAVE TO DB ================= */

async function saveData(){
  const grouped = {
    diesel: vans.filter(v => v.type==="diesel"),
    ev: vans.filter(v => v.type==="ev"),
    rental: vans.filter(v => v.type==="rental"),
    unknown:[]
  };

  if(!navigator.onLine){
    queue.push({type:"save", data:grouped});
    localStorage.setItem("queue", JSON.stringify(queue));
    localStorage.setItem("vans", JSON.stringify(vans));
    return;
  }

  await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1`, {
    method:"PATCH",
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({ data: grouped })
  });

  localStorage.setItem("vans", JSON.stringify(vans));
}

/* ================= SYNC QUEUE ================= */

async function sync(){
  if(!navigator.onLine) return;

  for(const item of queue){
    if(item.type==="save"){
      await saveData();
    }
  }

  queue = [];
  localStorage.setItem("queue", JSON.stringify(queue));
}

/* ================= UI (UNCHANGED) ================= */

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  vans.forEach(v=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <strong>${v.vin}</strong><br>
      <span class="small">${v.type}</span>
    `;
    list.appendChild(div);
  });
}

/* ================= MODAL (UNCHANGED LOOK) ================= */

function openModal(){
  if(!navigator.onLine){
    alert("Offline — will sync later.");
  }
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
  selectedType=null;
  document.getElementById("vin").value="";
  document.getElementById("typeLabel").innerText="None";
}

function setType(t){
  selectedType=t;
  document.getElementById("typeLabel").innerText=t;
}

/* ================= ADD VAN ================= */

function saveVan(){
  const vin=document.getElementById("vin").value.trim();

  if(!vin || !selectedType) return;

  const newVan={vin,type:selectedType};

  vans.push(newVan);
  localStorage.setItem("vans", JSON.stringify(vans));

  saveData(); // sync to DB or queue

  render();
  closeModal();
}

/* ================= NETWORK STATUS ================= */

function updateNet(){
  const el=document.getElementById("netStatus");

  if(navigator.onLine){
    el.textContent="Online";
    el.className="online";
  } else {
    el.textContent="Offline (cached data only)";
    el.className="offline";
  }
}

/* ================= THEME ================= */

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",
    document.body.classList.contains("light")?"light":"dark"
  );
}

/* ================= INIT ================= */

window.addEventListener("online", ()=>{ updateNet(); sync(); });
window.addEventListener("offline", updateNet);

(function init(){
  if(localStorage.getItem("theme")==="light"){
    document.body.classList.add("light");
  }

  updateNet();
  loadData();
})();
</script>

</body>
</html>
