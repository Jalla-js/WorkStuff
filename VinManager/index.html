<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIN Manager">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Van VIN Manager</title>

<style>
:root{
  --bg:#0e1118;
  --bg2:#121621;
  --card2:#1b2230;
  --text:#e7ebf3;
  --muted:#9aa3b2;
  --blue:#4aa3ff;
  --green:#3bd16f;
  --purple:#a07bff;
  --orange:#ffb057;
  --red:#ff5a5a;
}

/* softer light mode */
body.light{
  --bg:#f4f6fa;
  --bg2:#eef2f8;
  --card2:#ffffff;
  --text:#111318;
  --muted:#5c6677;
  --blue:#2f7dff;
  --green:#1ea85a;
  --purple:#7a5cff;
  --orange:#d9822b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  padding:16px;
}

/* header unchanged */
.header{
  position:sticky;
  top:0;
  background:rgba(15,17,21,.85);
  backdrop-filter:blur(12px);
  z-index:10;
  padding-bottom:12px;
}

h2{margin:0;font-size:22px}

.search,.modal input,.modal select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:var(--card2);
  color:var(--text);
}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.badge{padding:6px 10px;background:var(--card2);border-radius:999px}

/* GRID */
.section{margin-top:18px}
.sectionTitle{font-weight:700;margin-bottom:10px}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.tile{
  background:var(--card2);
  padding:14px;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.reg{font-weight:800}
.vin{font-size:12px;opacity:.75;word-break:break-all;margin-top:6px}

.tag{
  font-size:11px;
  padding:3px 8px;
  border-radius:999px;
  display:inline-block;
  margin-top:6px;
}

.ev{background:var(--blue)}
.diesel{background:var(--green)}
.rental{background:var(--purple)}
.unknown{background:var(--orange);color:#111}

.btnRow{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  margin-top:10px;
}

.btn{
  padding:9px;
  font-size:12px;
  border:none;
  border-radius:10px;
  background:#2a3244;
  color:white;
}

/* FAB (NEW ADD BUTTON) */
.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--blue);
  color:white;
  font-size:28px;
  border:none;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

/* MODAL */
.modalBackdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:flex-end;
  padding:14px;
  z-index:30;
}

.modal{
  width:100%;
  max-width:420px;
  background:var(--card2);
  border-radius:20px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.modalActions{
  display:flex;
  gap:10px;
  margin-top:4px;
}

.modalActions button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  color:white;
}

.saveM{background:var(--green)}
.cancelM{background:#444}
.deleteM{background:#8e2d2d}

/* status */
.online{font-size:12px;color:var(--green)}
.offline{font-size:12px;color:var(--red)}
</style>
</head>

<body>

<div class="header">
  <h2>Van VIN Manager</h2>
  <input class="search" id="search" placeholder="Search VIN or reg..." oninput="render()"/>

  <div class="stats" id="stats"></div>
  <div id="warning"></div>
</div>

<div id="app"><div style="opacity:.6">Loading vehicles…</div></div>

<!-- FAB ADD BUTTON -->
<button class="fab" onclick="openAdd()">+</button>

<!-- MODAL -->
<div class="modalBackdrop" id="modal">
  <div class="modal">
    <h3>Add Vehicle</h3>

    <select id="typeInput">
      <option value="diesel">Diesel</option>
      <option value="ev">EV</option>
      <option value="rental">Rental</option>
    </select>

    <input id="nameInput" placeholder="Reg"/>
    <input id="vinInput" placeholder="VIN"/>

    <div class="modalActions">
      <button class="saveM" onclick="confirmModal()">Save</button>
      <button class="cancelM" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>

/* ================= SUPABASE ================= */
const SUPABASE_URL="https://trhqigmwwfhuclaxdope.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyaHFpZ213d2ZodWNsYXhkb3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDEyNjcsImV4cCI6MjA5NTMxNzI2N30.XYXIXzCFqx5R2AoZ286WrKMN-FCSl_AZ9LoGdLuKMDc";

/* ================= STATE ================= */
let data={diesel:[],ev:[],rental:[],unknown:[]};
let editState=null;

/* ================= LOAD ================= */
async function loadData(){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1&select=data`,{
    headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
  });

  const json=await res.json();
  const d=json?.[0]?.data;

  if(d) data=d;

  render();
}

/* ================= AUTO SAVE ================= */
async function saveData(){
  await fetch(`${SUPABASE_URL}/rest/v1/van_data?id=eq.1`,{
    method:"PATCH",
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:`Bearer ${SUPABASE_KEY}`,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({data})
  });
}

/* ================= ADD ================= */
function openAdd(){
  editState=null;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function confirmModal(){
  const type=document.getElementById("typeInput").value;
  const name=document.getElementById("nameInput").value.trim();
  const vin=document.getElementById("vinInput").value.trim();

  if(!name||!vin) return;

  data[type].push({name,vin});

  closeModal();
  render();
  saveData(); // AUTO SYNC
}

/* ================= COPY ================= */
async function copyText(v){
  await navigator.clipboard.writeText(v);
}

/* ================= EDIT ================= */
function openEdit(type,vin){
  const idx=data[type].findIndex(v=>v.vin===vin);
  if(idx<0) return;

  const item=data[type][idx];

  document.getElementById("typeInput").value=type;
  document.getElementById("nameInput").value=item.name;
  document.getElementById("vinInput").value=item.vin;

  editState={type,idx};
  document.getElementById("modal").style.display="flex";
}

/* ================= RENDER ================= */
function section(title,type){
  const list=data[type];

  return `
  <div class="section">
    <div class="sectionTitle">${title}</div>
    <div class="grid">
      ${list.map(v=>`
        <div class="tile">
          <div>
            <div class="reg">${v.name}</div>
            <div class="vin">${v.vin}</div>
            <div class="tag ${type}">${type}</div>
          </div>

          <div class="btnRow">
            <button class="btn" onclick="copyText('${v.vin}')">Copy</button>
            <button class="btn" onclick="openEdit('${type}','${v.vin}')">Edit</button>
          </div>
        </div>
      `).join("")}
    </div>
  </div>`;
}

function render(){
  document.getElementById("app").innerHTML=
    section("Diesel","diesel")+
    section("EV","ev")+
    section("Rental","rental")+
    section("Unknown","unknown");
}

/* ================= INIT ================= */
loadData();

</script>

</body>
</html>
